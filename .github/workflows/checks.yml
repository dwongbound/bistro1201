name: Checks

on:
  pull_request:
  push:
    branches:
      - main
      - staging
      - develop

jobs:
  frontend-tests:
    name: Frontend Jest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../artifacts
          npm test -- --runInBand 2>&1 | tee ../artifacts/frontend-jest.txt

      - name: Upload frontend test artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-jest-report
          path: artifacts/frontend-jest.txt
          if-no-files-found: error

  backend-tests:
    name: Backend Cargo Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bistro1201_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bistro1201_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bistro1201_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Run backend unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../artifacts
          cargo test 2>&1 | tee ../artifacts/backend-cargo-test.txt

      - name: Upload backend test artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-cargo-test-report
          path: artifacts/backend-cargo-test.txt
          if-no-files-found: error

  # Once develop has been merged into staging and the tests above pass on
  # staging, promote staging to main by opening and merging a staging -> main
  # pull request (main is protected, so it can't be pushed to directly).
  promote-to-main:
    name: Promote staging to main
    needs: [frontend-tests, backend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    # One promotion at a time; a newer staging push waits for the last one.
    concurrency:
      group: promote-to-main
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Merge staging into main
        id: promote
        shell: bash
        run: |
          set -eu
          git fetch origin main

          # Nothing to do when main already has everything staging has.
          if git diff --quiet origin/main "$GITHUB_SHA"; then
            echo "main already matches staging"
            echo "deploy_backend=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Remember whether the backend changed before main moves, because
          # the deploy below has to be started by hand (see next step).
          if git diff --quiet origin/main "$GITHUB_SHA" -- backend fly.toml; then
            echo "deploy_backend=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_backend=true" >> "$GITHUB_OUTPUT"
          fi

          # Reuse an open staging -> main PR if there is one, else open one.
          pr=$(gh pr list --base main --head staging --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create --base main --head staging \
              --title "Promote staging to main" \
              --body "Opened automatically after staging passed its tests (${GITHUB_SHA})."
            pr=$(gh pr list --base main --head staging --state open --json number --jq '.[0].number')
          fi

          # A merge commit, like every earlier promotion, so main keeps
          # staging's history and later promotions stay conflict-free.
          gh pr merge "$pr" --merge --match-head-commit "$GITHUB_SHA"

      # A merge made with GITHUB_TOKEN doesn't fire other workflows, so the
      # backend deploy's push trigger never sees it. Start it explicitly.
      - name: Deploy backend
        if: steps.promote.outputs.deploy_backend == 'true'
        run: gh workflow run deploy-production.yml --ref main
